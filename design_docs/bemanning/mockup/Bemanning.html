  React.useEffect(() => {
    const up = ev => { const d = dragRef.current; if (!d) return; dragRef.current = null; setDrag(null); latest.current.finish(d, ev); };
    const down = () => { setMenu(null); setDpop(null); setAsk(null); };
    const key = e => {
      if (e.key === 'Shift') setShift(true);
      if (e.target.tagName === 'INPUT') return;
      const L = latest.current, k = e.key.toLowerCase();
      if ((e.metaKey || e.ctrlKey) && k === 'z') { e.preventDefault(); return e.shiftKey ? L.redo() : L.undo(); }
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (k >= '1' && k <= String(COMPS.length)) return L.pickBrush(COMPS[+k - 1].id, true);
      if (k === 'escape') { down(); setBrush(null); setTool('select'); return; }
      if (L.vmode && L.vPid && (k === 'arrowup' || k === 'arrowdown')) { e.preventDefault(); return L.stepV(k === 'arrowup' ? -1 : 1); }
      if (k === 'v') { setTool('select'); setBrush(null); } else if (k === 'b') L.setToolX('paint'); else if (k === 't') L.setToolX(L.tool === 'erase' ? 'select' : 'erase');
      else if (k === 'e' && (L.sel || (L.vmode && L.vPid))) L.toggleExp(L.sel ? L.sel.pid : L.vPid);
      else if ((k === 'delete' || k === 'backspace') && L.sel) L.clearCells([L.sel]);
    };
    const keyUp = e => { if (e.key === 'Shift') setShift(false); };
    const blur = () => setShift(false);
    window.addEventListener('mouseup', up); window.addEventListener('mousedown', down); window.addEventListener('keydown', key); window.addEventListener('keyup', keyUp); window.addEventListener('blur', blur);
    return () => { window.removeEventListener('mouseup', up); window.removeEventListener('mousedown', down); window.removeEventListener('keydown', key); window.removeEventListener('keyup', keyUp); window.removeEventListener('blur', blur); };
  }, []);

  const cellDown = (ri, day, e) => {
    if (e.button !== 0) return;
    const p = rowsV[ri]; setSel({ pid: p.id, day }); if (!DAYS[day].we) setFocusDay(day);
    const mode = tool === 'erase' || e.altKey ? 'erase' : tool === 'paint' && brush ? 'paint' : null;
    if (!mode) return;
    e.preventDefault(); e.stopPropagation(); setAsk(null);
    const d = { mode, half: mode === 'paint' && e.shiftKey, r0: ri, d0: day, r1: ri, d1: day }; dragRef.current = d; setDrag(d);
  };
  const cellEnter = (ri, day) => { setHover({ ri, day }); const d = dragRef.current; if (d && (d.r1 !== ri || d.d1 !== day)) { const n = { ...d, r1: ri, d1: day }; dragRef.current = n; setDrag(n); } };
  const cellCtx = (p, day, e) => { setMenu({ p, day, x: e.clientX, y: e.clientY }); setSel({ pid: p.id, day }); };
  const gctx = { availOf, blocksOf, isSick, brush, tool, focusDay, sel, inRect, dragMode: drag && (drag.mode + (drag.half ? ' half' : '')), weekOf, multi: tw.multi, ops, cellDown, cellEnter, cellCtx, toggleExp, vmode, stepV, pickBrush };

  const pct = tReq ? Math.round(tCov / tReq * 100) : 0;
  const fdl = DAYS[focusDay];
  let screen;
  if (view !== 'bemanning') screen = (
    <div className="bm-ph">
      <h1>{TABS.find(t => t.id === view).label}</h1>
      <span className="bm-ctxchip"><Icon name="calendar" size={14} />Uke 42 · {fdl.long} {fdl.d}. okt{brush ? ' · ' + compById[brush].name : ''}</span>
      <p>Samme tidslinje som Bemanning. Uke, dag og kompetanse følger med når du bytter visning. Denne visningen er ikke med i skissen.</p>
      <div><Button variant="secondary" size="sm" icon="arrow-left" onClick={() => setView('bemanning')}>Tilbake til Bemanning</Button></div>
    </div>
  );
  else screen = (
    <div className="bm-page">
      <div className="bm-hdr">
        <div className="bm-title"><h1>Bemanning</h1><span className="bm-meta">{PEOPLE.length} faste · {tRem < 0.05 ? 'Ingen underdekning' : pct + ' % dekket · ' + fmtH(tRem) + ' t gjenstår'}{tOT > 0.05 ? ' · ' + fmtH(tOT) + ' t overtid' : ''}{tWe > 0.05 ? ' · helg ' + fmtH(tWe) + ' t åpent' : ''}</span></div>
        <div className="bm-week">
          <IconButton label="Forrige uke" icon="chevron-left" onClick={() => notify({ message: 'Bare uke 42 finnes i skissen.', variant: 'info' })} />
          <b>U42 <span>12.–18. okt</span></b>
          <IconButton label="Neste uke" icon="chevron-right" onClick={() => notify({ message: 'Bare uke 42 finnes i skissen.', variant: 'info' })} />
        </div>
      </div>
      <div className="bm-tools">
        <div className="bm-z">
          <IconButton label="Angre" tooltip="Angre (Ctrl/Cmd+Z)" icon="undo-2" onClick={undo} disabled={!hist.past.length} />
          <IconButton label="Gjør om" tooltip="Gjør om (Ctrl/Cmd+Shift+Z)" icon="redo-2" onClick={redo} disabled={!hist.future.length} />
          <Segmented size="compact" aria-label="Verktøy" value={tool} onChange={setToolX} options={[
            { value: 'select', label: <span className="bm-seg"><Icon name="mouse-pointer-2" size={14} />Velg<kbd>V</kbd></span> },
            { value: 'paint', label: <span className="bm-seg"><Icon name="paintbrush" size={14} />Pensel<kbd>B</kbd></span>, title: 'Mal hele dager. Uten valgt kompetanse velges den med størst gjenstående behov for valgt dag.' },
            { value: 'erase', label: <span className="bm-seg"><Icon name="eraser" size={14} />Tøm<kbd>T</kbd></span>, title: 'Dra over celler for å tømme dem (eller hold Alt)' }]} />
        </div>
        <div className="bm-z">
          {brush ? <><span className="bm-brush" style={{ '--cc': compById[brush].color }}><i></i>{compById[brush].name}<button onClick={() => { setBrush(null); setTool('select'); }} aria-label="Slå av fokus" title="Slå av fokus (Esc)">×</button></span>
            <span className="bm-hint"><span><b>Klikk</b> hel dag</span><span><b>Shift</b> halv dag</span><span><b>Dra</b> flere</span><span><b>Alt</b> tøm</span></span></>
            : <span className="bm-nobrush">Velg en kompetanse i behovet (1–{COMPS.length}) for å fokusere og male</span>}
        </div>
        {unres.length > 0 && <span className="bm-unres"><Icon name="triangle-alert" size={14} />{unres.length} uløste blokker<button onClick={() => commit(cur => ({ ...cur, blocks: cur.blocks.filter(b => !cur.sick[b.pid + '|' + b.day]) }))}>Fjern</button></span>}
        <div className="bm-tr">
          <span className="bm-z"><span className="bm-zl">Utvid</span><Segmented size="compact" aria-label="Utvid som" value={tw.expand} onChange={v => setTweak('expand', v)} options={[{ value: 'row', label: 'Rad', title: 'Utvid flere personer, horisontal tidslinje 07–15' }, { value: 'vertical', label: 'Uke', title: 'Én person om gangen, vertikal dag 06–21 med overtid' }]} /></span>
          {!vmode && <Button variant="ghost" size="sm" icon={expanded.size ? 'chevrons-down-up' : 'chevrons-up-down'} onClick={() => setExpanded(expanded.size ? new Set() : new Set(rowsV.map(p => p.id)))}>{expanded.size ? 'Fold alle' : 'Utvid alle'}</Button>}
        </div>
      </div>
      <div className="bm-scroll" ref={scrollRef} data-half={shift && tool === 'paint' && brush ? '1' : null} data-t={tool === 'paint' && brush ? 'paint' : tool} onMouseLeave={() => setHover(null)}>
        <div className="bm-in">
          <DemandStrip days={DAYS} comps={COMPS} demand={st.demand} assigned={assigned} assignedOT={assignedOT} freeElig={freeElig} brush={brush} onPick={pickFromDemand} preview={preview} focusDay={focusDay} setFocusDay={setFocusDay} stripMode={tw.stripMode} cap={cap} carry={st.carry} collapsed={stripColl} onToggle={() => setStripColl(c => !c)}
            onCellClick={(comp, day, e) => { e.stopPropagation(); setFocusDay(day); setDpop({ comp, day, x: e.clientX, y: e.clientY }); }} />
          <div className="bm-r bm-sec bm-psec"><div className="bm-l"><span className="keb">Personell</span><span className="bm-lh">{brush && tw.inelig !== 'dim' ? splitAt + ' med ' + compById[brush].name : PEOPLE.length + ' faste'}</span><span className="bm-lh" style={{ marginLeft: 'auto' }}>uke · t</span></div><span className="bm-lh">{'Dobbeltklikk en dag for ' + (vmode ? 'ukevisning med overtid' : 'timer')}</span></div>
          {pinned >= 0 && <div className="bm-pin"><PersonRow p={rowsV[pinned]} ri={pinned} exp={true} dim={!eligibleP(rowsV[pinned])} days={DAYS} comps={COMPS} compById={compById} ctx={gctx} /></div>}
          {rowsV.map((p, ri) => (
            <React.Fragment key={p.id}>
              {ri === splitAt && <div className="bm-r bm-div"><div className="bm-l" onClick={() => setHideInelig(true)}><Icon name="chevron-down" size={14} />Uten {compById[brush].name} · {nIn}</div><span>Kan ikke tildeles {compById[brush].name}</span></div>}
              {ri === pinned ? <div className="bm-r bm-ghost" onClick={() => setVPid(null)} title="Fold sammen"><div className="bm-l"><Icon name="arrow-up" size={14} /><span className="bm-nm">{p.name}</span></div><span>Redigeres øverst · klikk for å folde sammen</span></div> :
              <PersonRow p={p} ri={ri} exp={isExp(p.id)} dim={!eligibleP(p)} days={DAYS} comps={COMPS} compById={compById} ctx={gctx} />}
            </React.Fragment>
          ))}
          {brush && hideInelig && tw.inelig === 'bottom' && nIn > 0 && <div className="bm-r bm-div"><div className="bm-l" onClick={() => setHideInelig(false)}><Icon name="chevron-right" size={14} />Uten {compById[brush].name} · {nIn}</div><span>Skjult</span></div>}
        </div>
      </div>
    </div>
  );
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      <TopBar brand="Expo Planner" tabs={TABS} active={view} onSelect={setView} onBrand={() => setView('bemanning')}
        right={<><span className="ksave" title="Lagret i nettleseren"><i></i><span>Lagret</span></span><span className="kzdiv" style={{ height: 18 }}></span><Button variant="ghost" size="sm" onClick={() => notify({ message: 'Innstillinger er ikke med i skissen.', variant: 'info' })}>Innstillinger</Button></>} />
      <main style={{ flex: 1, minHeight: 0 }}>{screen}</main>
      {dpop && <DemandPopover pop={dpop} comps={COMPS} days={DAYS} demand={st.demand} assigned={assigned} freeElig={freeElig} brush={brush} onClose={() => setDpop(null)} onCarry={carry} onPick={pickFromDemand} />}
      {ask && <div data-surface="raised" className="bm-pop bm-ask" style={{ left: Math.min(ask.x, window.innerWidth - 300), top: Math.min(ask.y + 10, window.innerHeight - 180), '--cc': compById[ask.comp].color }} onMouseDown={e => e.stopPropagation()}>
        <div className="bm-pop-h"><i className="bm-sw"></i><b>{compById[ask.comp].name}</b><span>{ask.cells.length} {ask.cells.length === 1 ? 'dag' : 'dager'}</span></div>
        <p>{ask.n === 1 && ask.cells.length === 1 ? 'Dagen har allerede andre oppgaver.' : ask.n + ' av dagene har allerede andre oppgaver.'} Vil du fylle den ledige tiden, eller erstatte alt?</p>
        <div className="bm-pop-f">
          <Button size="sm" variant="ghost" onClick={() => setAsk(null)}>Avbryt</Button>
          <Button size="sm" variant="secondary" onClick={() => { paintCells(ask.cells, ask.comp, 'replace'); setAsk(null); }}>Erstatt</Button>
          <Button size="sm" variant="accent" onClick={() => { paintCells(ask.cells, ask.comp, 'fill'); setAsk(null); }}>Fyll resten</Button>
        </div>
      </div>}
      {menu && (() => { const { p, day } = menu, d = DAYS[day], sk = isSick(p.id, day), bl = blocksOf(p.id, day), act = f => () => { f(); setMenu(null); };
        const rest = []; for (let i = day; i < 5; i++) rest.push(i);
        return <div data-surface="raised" className="bm-menu" style={{ left: Math.min(menu.x, window.innerWidth - 270), top: Math.min(menu.y, window.innerHeight - 240) }} onMouseDown={e => e.stopPropagation()}>
          <div className="grp">{p.name} · {d.wd} {d.d}.</div>
          <button onClick={act(() => toggleExp(p.id))}><Icon name={isExp(p.id) ? 'chevrons-down-up' : 'chevrons-up-down'} size={14} />{isExp(p.id) ? 'Fold sammen' : vmode ? 'Utvid til ukevisning' : 'Utvid raden til timer'}<kbd style={{ marginLeft: 'auto' }}>E</kbd></button>
          <button disabled={!bl.length} onClick={act(() => clearCells([{ pid: p.id, day }]))}><Icon name="eraser" size={14} />Tøm dagen</button>
          <hr />
          {sk ? <button disabled={d.we} onClick={act(() => setSickDays(p, [day], false))}><Icon name="rotate-ccw" size={14} />Friskmeld {d.long}</button>
            : <><button className="dg" disabled={d.we || baseAvail(p.id, day).off} onClick={act(() => setSickDays(p, [day], true))}><Icon name="thermometer" size={14} />Meld syk {d.long}</button>
              <button className="dg" disabled={d.we || day >= 4} onClick={act(() => setSickDays(p, rest, true))}><Icon name="thermometer" size={14} />Meld syk ut uka</button></>}
        </div>; })()}
      <div className="ktoasts">{toasts.map(t => <NotificationToastCard key={t.id} {...t} action={t.action && { ...t.action, onClick: () => { t.action.onClick(); setToasts(ts => ts.filter(x => x.id !== t.id)); } }} showDismissButton onDismiss={() => setToasts(ts => ts.filter(x => x.id !== t.id))} />)}</div>
      <TweaksPanel>
        <TweakSection label="Fokus" />
        <TweakRadio label="Uten kompetansen" value={tw.inelig} options={[{ value: 'bottom', label: 'Samle nederst' }, { value: 'dim', label: 'Kun dempet' }, { value: 'hide', label: 'Skjul' }]} onChange={v => setTweak('inelig', v)} />
        <TweakSection label="Visning" />
        <TweakRadio label="Utvid som" value={tw.expand} options={[{ value: 'row', label: 'Rad (horisontal)' }, { value: 'vertical', label: 'Uke (vertikal)' }]} onChange={v => setTweak('expand', v)} />
        <TweakRadio label="Flere oppgaver, foldet dag" value={tw.multi} options={[{ value: 'timeline', label: 'Mini-tidslinje' }, { value: 'chips', label: 'Brikker' }]} onChange={v => setTweak('multi', v)} />
        <TweakRadio label="Behovstall" value={tw.stripMode} options={[{ value: 'rest', label: 'Gjenstår' }, { value: 'ratio', label: 'Tildelt / behov' }]} onChange={v => setTweak('stripMode', v)} />
        <TweakToggle label="Mørk modus" value={tw.dark} onChange={v => setTweak('dark', v)} />
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
