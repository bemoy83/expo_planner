    </div>
  );
}
function App() {
  const [view, setView] = React.useState('kalender');
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => { document.documentElement.dataset.mtone = tw.mTone; }, [tw.mTone]);
  React.useEffect(() => { document.documentElement.dataset.levels = tw.levels; }, [tw.levels]);
  const [dark, setDark] = React.useState(localStorage.getItem('ep-dark') === '1');
  const [tooltips, setTooltips] = React.useState(true);
  const [hist, setHist] = React.useState({ rows: EPd.ROWS, past: [], future: [] });
  const rows = hist.rows;
  const [grouping, setGrouping] = React.useState(['project', 'phase']);
  const [collapsed, setCollapsed] = React.useState(new Set());
  const [zoom, setZoom] = React.useState('normal');
  const [tool, setTool] = React.useState('select');
  const [project, setProject] = React.useState('');
  const [hideEmpty, setHideEmpty] = React.useState(false);
  const [onlyOpen, setOnlyOpen] = React.useState(false);
  const [selection, setSelection] = React.useState({ rowId: 'r3', col: 3 });
  const [inspOpen, setInspOpen] = React.useState(true);
  const [toasts, setToasts] = React.useState([]);
  const scrollRef = React.useRef(null);
  React.useEffect(() => { document.documentElement.classList.toggle('dark', dark); localStorage.setItem('ep-dark', dark ? '1' : '0'); }, [dark]);
  const notify = t => { const id = Math.random(); setToasts(ts => [...ts, { ...t, id }]); setTimeout(() => setToasts(ts => ts.filter(x => x.id !== id)), 7000); };
  const commit = fn => setHist(h => { const next = fn(h.rows); return next === h.rows ? h : { rows: next, past: [...h.past, h.rows].slice(-100), future: [] }; });
  const undo = () => setHist(h => h.past.length ? { rows: h.past[h.past.length - 1], past: h.past.slice(0, -1), future: [h.rows, ...h.future] } : h);
  const redo = () => setHist(h => h.future.length ? { rows: h.future[0], past: [...h.past, h.rows], future: h.future.slice(1) } : h);
  React.useEffect(() => {
    const k = e => { if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z') return; if (e.target.tagName === 'INPUT') return; e.preventDefault(); e.shiftKey ? redo() : undo(); };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, []);
  const setFte = (rowId, fn) => commit(rs => rs.map(r => r.id === rowId ? { ...r, fte: fn(r) } : r));
  const onCommit = (rowId, col, v) => setFte(rowId, r => { const f = { ...r.fte }; if (v === null || v === 0) delete f[col]; else f[col] = v; return f; });
  const onRange = (rowId, a, b) => {
    if (tool === 'clear') return setFte(rowId, r => Object.fromEntries(Object.entries(r.fte).filter(([i]) => +i < a || +i > b)));
    setFte(rowId, r => {
      const outside = Object.fromEntries(Object.entries(r.fte).filter(([i]) => +i < a || +i > b));
      const work = []; for (let i = a; i <= b; i++) if (EPd.DAYS[i].type === 'Arbeidsdag') work.push(i);
      return { ...outside, ...spread(needF(r) - sumF(outside), work) };
    });
  };
  const onSpread = rowId => setFte(rowId, r => { const outside = Object.fromEntries(Object.entries(r.fte).filter(([i]) => !r.window.includes(+i))); return { ...outside, ...spread(needF(r) - sumF(outside), r.window) }; });
  const suggest = projectNos => {
    const targets = rows.filter(r => projectNos.includes(r.projectNo) && sumF(r.fte) === 0);
    if (!targets.length) return notify({ message: 'Alle radene har FTE allerede. Foreslå plan fyller bare tomme rader.', variant: 'info' });
    const ids = new Set(targets.map(r => r.id));
    commit(rs => rs.map(r => ids.has(r.id) ? { ...r, fte: spread(needF(r), r.window) } : r));
    const names = [...new Set(targets.map(r => r.projectName))];
    notify({ message: 'Foreslått plan for ' + targets.length + ' rader i ' + (names.length === 1 ? names[0] : names.length + ' prosjekter') + '.', variant: 'success', action: { label: 'Angre', onClick: undo } });
  };
  const visible = rows.filter(r => (!project || r.projectNo === project) && (!onlyOpen || sumF(r.fte) < needF(r) - 0.05));
  const items = buildItems(visible, grouping, collapsed, { hideEmpty: hideEmpty || !!project || onlyOpen });
  const needByDay = EPd.DAYS.map((d, i) => rows.reduce((a, r) => a + (r.fte[i] || 0), 0));
  const short = EPd.DAYS.filter((d, i) => ((d.type === 'Arbeidsdag' ? 21 : 0) + (EPd.HIRED[i] || 0) - (EPd.ABSENT[i] || 0)) < needByDay[i]).length;
  const selRow = rows.find(r => r.id === (selection && selection.rowId));
  const toggle = key => setCollapsed(s => { const n = new Set(s); n.has(key) ? n.delete(key) : n.add(key); return n; });
  const topKeys = items.filter(i => i.kind === 'group' && i.depth === 0).map(i => i.key);
  const goToday = () => { if (scrollRef.current) scrollRef.current.scrollLeft = 0; };
  const meta = [EPd.PROJECTS.length + ' prosjekter', rows.length + ' rader', short ? short + (short === 1 ? ' dag' : ' dager') + ' med underdekning' : 'Ingen underdekning', 'Lagret i nettleseren'].join(' · ');
  const T = (t, s) => tooltips ? s : undefined;
  let screen;
  if (view !== 'kalender') screen = <><PageHeader title={TABS.find(t => t.id === view).label} /><p className="kplaceholder">Ikke med i denne skissen. Kalender er planleggingsflaten.</p></>;
  else screen = (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      <div className="khdr">
        <div className="khdr-title"><h1 className="ktitle">Kalender</h1><span className="kmetaline">{meta}</span></div>
        <Button variant="accent" size="sm" onClick={() => suggest(project ? [project] : EPd.PROJECTS.map(p => p.no))} title={T(0, 'Fordel behovet på tomme rader i ' + (project ? 'prosjektet' : 'alle prosjekter') + '. Rader som har FTE røres ikke.')}>{'✦ Foreslå plan' + (project ? '' : ' for alle')}</Button>
      </div>
      <div className="ktools">
        <div className="kzone">
          <IconButton label="Angre" tooltip="Angre (Ctrl/Cmd+Z)" icon="undo-2" onClick={undo} disabled={!hist.past.length} />
          <IconButton label="Gjør om" tooltip="Gjør om (Ctrl/Cmd+Shift+Z)" icon="redo-2" onClick={redo} disabled={!hist.future.length} />
          <Segmented size="compact" aria-label="Verktøy" value={tool} onChange={setTool} options={[{ value: 'select', label: <span className="kseg"><Icon name="mouse-pointer-2" size={14} />Velg</span>, title: 'Velg og skriv FTE i cellene' }, { value: 'distribute', label: <span className="kseg"><Icon name="pencil" size={14} />Fordel behov</span>, title: 'Tegn over dager på en rad: det som gjenstår av radens behov fordeles på arbeidsdagene du tegner over' }, { value: 'clear', label: <span className="kseg"><Icon name="eraser" size={14} />Tøm</span>, title: 'Tegn over celler for å tømme dem' }]} />
        </div>
        <span className="kzdiv"></span>
        <div className="kzone">
          <FilterMenu project={project} setProject={setProject} hideEmpty={hideEmpty} setHideEmpty={setHideEmpty} onlyOpen={onlyOpen} setOnlyOpen={setOnlyOpen} />
          <GroupingBar grouping={grouping} onChange={g => { setGrouping(g); setCollapsed(new Set()); }} />
          <Button variant="ghost" size="sm" icon={collapsed.size ? 'chevrons-up-down' : 'chevrons-down-up'} onClick={() => setCollapsed(collapsed.size ? new Set() : new Set(topKeys))}>{collapsed.size ? 'Utvid alle' : 'Fold sammen'}</Button>
        </div>
        <div className="kzone" style={{ marginLeft: 'auto' }}>
          <Button variant="ghost" size="sm" onClick={goToday}>I dag</Button>
          <Segmented size="compact" aria-label="Kolonnebredde" value={zoom} onChange={setZoom} mono options={[{ value: 'compact', label: 'S' }, { value: 'normal', label: 'M' }, { value: 'wide', label: 'L' }]} />
          <IconButton label={inspOpen ? 'Skjul raddetaljer' : 'Vis raddetaljer'} icon="panel-right" variant={inspOpen ? 'active' : 'default'} onClick={() => setInspOpen(!inspOpen)} />
        </div>
      </div>
      <div className={'kwork' + (inspOpen ? '' : ' noinsp')}>
        <div style={{ minWidth: 0, minHeight: 0 }}>
          <KalenderGrid items={items} grouping={grouping} rows={rows} W={ZOOM[zoom]} selection={selection} setSelection={s => { setSelection(s); }} onCommit={onCommit} tool={tool} onRange={onRange}
            onSuggest={no => suggest([no])} onAddRow={() => notify({ message: 'Ny rad: velg kompetanse, fase og grunnlag. Ikke med i denne skissen.', variant: 'info' })} collapsed={collapsed} onToggle={toggle} scrollRef={scrollRef} needByDay={needByDay} onFoldAll={() => setCollapsed(collapsed.size ? new Set() : new Set(topKeys))} foldLabel={collapsed.size ? 'Utvid alle' : 'Fold sammen'} projectTotal={tw.projectTotal} windowDot={tw.windowDot} sums={tw.sums} />
        </div>
        {inspOpen && <RowInspector workStyle="mono" row={selRow} rows={rows} needByDay={needByDay} onSpread={onSpread} onClose={() => setInspOpen(false)} />}
      </div>
    </div>
  );
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      <TopBar brand="Expo Planner" tabs={TABS} active={view} onSelect={setView} onBrand={() => setView('kalender')}
        right={<>
          <span className="ksave" title="Lagret i nettleseren"><i></i><span>Lagret</span></span>
          <span className="kzdiv" style={{ height: 18 }}></span>
          <Button variant="ghost" size="sm" icon="refresh-cw" title={T(0, 'Sist: location_format_from-2026-10-01_to-2026-12-31.xlsx, 2. okt 2026')} onClick={() => notify({ message: 'Hallkalenderen er oppdatert for 1. okt til 31. des: 2 nye arrangementer, 1 endret, 0 borte, 37 uendret. Kan angres med Ctrl/Cmd+Z.', variant: 'success' })}><span className="khaller-l">Haller · 2. okt</span></Button>
          <SettingsMenu dark={dark} setDark={setDark} tooltips={tooltips} setTooltips={setTooltips} notify={notify} />
        </>} />
      <main style={{ flex: 1, minHeight: 0 }}>{screen}</main>
      <div className="ktoasts">{toasts.map(t => <NotificationToastCard key={t.id} {...t} action={t.action && { ...t.action, onClick: () => { t.action.onClick(); setToasts(ts => ts.filter(x => x.id !== t.id)); } }} showDismissButton onDismiss={() => setToasts(ts => ts.filter(x => x.id !== t.id))} />)}</div>
      <TweaksPanel>
        <TweakSection label="Rader" />
        <TweakRadio label="Montering-farge" value={tw.mTone} options={[{ value: 'slate', label: 'Skifer' }, { value: 'sand', label: 'Sand' }, { value: 'ink', label: 'Blekk' }, { value: 'olive', label: 'Oliven' }, { value: 'sage', label: 'Salvie' }]} onChange={v => setTweak('mTone', v)} />
        <TweakToggle label="Vindusprikk i tomme celler" value={tw.windowDot} onChange={v => setTweak('windowDot', v)} />
        <TweakSection label="Totallinjer" />
        <TweakRadio label="Nivåmarkering" value={tw.levels} options={[{ value: 'project', label: 'Kun prosjekt' }, { value: 'none', label: 'Ingen' }, { value: 'all', label: 'Alle nivåer' }]} onChange={v => setTweak('levels', v)} />
        <TweakRadio label="Summer per dag" value={tw.sums} options={[{ value: 'folded', label: 'Når foldet' }, { value: 'always', label: 'Alltid' }]} onChange={v => setTweak('sums', v)} />
        <TweakRadio label="Farge på totallinjen" value={tw.projectTotal} options={[{ value: 'venue', label: 'Hallfaser' }, { value: 'work', label: 'Mont./Dem.' }, { value: 'neutral', label: 'Nøytral' }]} onChange={v => setTweak('projectTotal', v)} />
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
